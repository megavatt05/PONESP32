; PlatformIO project for ESP32-C3 + ESP-IDF 6.1.0
; Modbus RTU Master (3-pin RS485: TX / RX / DE)

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf

; Pin ESP-IDF 6.1.x
platform_packages =
    framework-espidf @ https://github.com/espressif/esp-idf.git#v6.1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

board_build.flash_mode = qio
board_build.f_cpu = 160000000L

build_flags =
    -DCONFIG_MB_COMM_MODE_RTU_EN=1

lib_deps =
    espressif/esp-modbus @ ^2.1.0
